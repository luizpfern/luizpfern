name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=luizpfern&title_color=0066FF&text_color=8A8A8A&icon_color=0066FF&bg_color=000000&ring_color=0066FF&show_icons=true&hide_border=true&count_private=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=luizpfern&title_color=0066FF&text_color=8A8A8A&icon_color=0066FF&bg_color=000000&hide_border=true&layout=donut
          path: profile/langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Recolor language donut
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("profile/langs.svg")
          svg = path.read_text(encoding="utf-8")
          for old, new in {
              "#f1e05a": "#0066FF",
              "#b07219": "#0052FF",
              "#e34c26": "#0084FF",
              "#c6538c": "#E8E8E8",
              "#3178c6": "#8A8A8A",
          }.items():
              svg = svg.replace(old, new)
          path.write_text(svg, encoding="utf-8")
          PY

      - name: Generate WakaTime card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: wakatime
          options: username=luizpfern&title_color=0066FF&text_color=8A8A8A&icon_color=0066FF&bg_color=000000&hide_border=true
          path: profile/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Match card pair heights
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          def dims(svg):
              w = int(float(re.search(r'width="([\d.]+)"', svg).group(1)))
              h = int(float(re.search(r'height="([\d.]+)"', svg).group(1)))
              return w, h

          langs_path = Path("profile/langs.svg")
          waka_path = Path("profile/wakatime.svg")
          langs = langs_path.read_text(encoding="utf-8")
          waka = waka_path.read_text(encoding="utf-8")
          lw, lh = dims(langs)
          ww, wh = dims(waka)
          target_w = ww
          langs_h = round(lh * target_w / lw)
          target_h = max(wh, langs_h)

          langs = re.sub(r'width="[\d.]+"', f'width="{target_w}"', langs, count=1)
          langs = re.sub(r'height="[\d.]+"', f'height="{target_h}"', langs, count=1)
          if "preserveAspectRatio=" not in langs:
              langs = langs.replace("<svg", '<svg preserveAspectRatio="xMidYMin meet"', 1)
          if 'fill="#000000" width="100%"' not in langs:
              langs = langs.replace(
                  ">",
                  '>\n  <rect width="100%" height="100%" fill="#000000"/>',
                  1,
              )
          waka = re.sub(r'height="[\d.]+"', f'height="{target_h}"', waka, count=1)
          waka = re.sub(
              r'viewBox="0 0 [\d.]+ [\d.]+"',
              f'viewBox="0 0 {ww} {target_h}"',
              waka,
              count=1,
          )
          langs_path.write_text(langs, encoding="utf-8")
          waka_path.write_text(waka, encoding="utf-8")
          PY

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
